[SPARK]
spark.app.name = GlamiraPageViewStreaming

[KAFKA]
kafka.bootstrap.servers = ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
kafka.security.protocol = ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
kafka.sasl.mechanism = ${KAFKA_SASL_MECHANISM:PLAIN}
kafka.sasl.jaas.config = ${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username="CHANGE_ME" password="CHANGE_ME";}
subscribe = ${KAFKA_SUBSCRIBE:product_view}
startingOffsets = ${KAFKA_STARTING_OFFSETS:latest}

[POSTGRES]
host = ${POSTGRES_HOST:postgres}
port = ${POSTGRES_PORT:5432}
dbname = ${POSTGRES_DB:postgres}
user = ${POSTGRES_USER:postgres}
password = ${POSTGRES_PASSWORD:CHANGE_ME}
